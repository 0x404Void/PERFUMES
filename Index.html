<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERFUMES</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <header>
        <div class="logo">
            PERFUMES
        </div>

        <div class="icones">

            <i class="fa-solid fa-magnifying-glass"></i>
            
            <i class="fa-regular fa-user"></i>

            <i class="fa-solid fa-bag-shopping"></i>
        </div>

    </header>

    <!-- PRODUTOS -->

    <section class="produtos">

        <div class="card">
            <img src="imagens/malbec1.jpg.webp" alt="Malbec Tradicional">

            <h2>MALBEC</h2>

            <P>malbec Tracional</P>

            <span class="preco-antigo">R$ 199,90</span>

            <h3>R$ 159,90</h3>

            <button>COMPRAR</button>

        </div>

        <div class="card">
            <img src="imagens/malbec2.jpg.webp" alt="Malbec Gold">

            <h2>MALBEC GOLD</h2>

            <p>Malbec Gold</p>

            <span class="preco-antigo">R$ 229,90</span>

            <h3>R$ 189,90</h3>

            <button>COMPRAR</button>

        </div>

        <div class="card">
            <img src="imagens/essencial.jpg.webp" alt="Essencial">

            <h2>ESSENCIAL</h2>

            <p>Essencial</p>

            <span class="preco-antigo">R$ 159,90</span>

            <h3>R$ 119,90</h3>
            
            <button>COMPRAR</button>

        </div>

    </section>

</body>

</html>
